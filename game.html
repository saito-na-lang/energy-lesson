<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>エネルギー究極の二択</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 班で1台のChromebookを囲む1画面ゲーム。上に進み具合、中央に「いまやること」を1つだけ大きく出す */
:root{
  --navy:#14365A; --navy-2:#1F4C7A; --orange:#E8773F; --orange-soft:#FDE9DD; --orange-dark:#9A3E12;
  --bg:#EDF1F5; --paper:#FFFFFF; --ink:#18263A; --muted:#55667A; --line:#D3DCE6; --soft:#F1F5FA;
  --c-stable:#2F6FD6; --c-cost:#B9800A; --c-env:#2B9658; --c-safe:#D24646;
  --ok:#2B9658; --ok-soft:#DFF3E7; --bad:#D24646; --bad-soft:#FBE3E3; --yellow:#FFF3C9;
  --a:#2F6FD6; --a-soft:#E3EDFC; --b:#D9822B; --b-soft:#FCEBD9;
  --f-display:"Dela Gothic One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.nospeak #rd{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:18px;line-height:1.6}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--orange);outline-offset:2px}
ruby{ruby-position:over}
rt{font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:-.04em}
body.nofuri rt{display:none}
h1,h2,h3{margin:0;text-wrap:balance}
.screen{max-width:1100px;margin:0 auto;padding-block:16px;padding-inline:16px;display:grid;gap:16px}

.btn{border:0;border-radius:14px;padding:14px 28px;font-size:21px;font-weight:800;cursor:pointer;min-height:58px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn-main{background:var(--orange);color:#fff;box-shadow:0 4px 0 #B9531F}
.btn-main:disabled{background:#C7CFD8;box-shadow:0 4px 0 #A5AFBA;cursor:not-allowed}
.btn-sub{background:var(--paper);color:var(--navy);border:3px solid var(--navy)}
.btn-ghost{background:transparent;color:#fff;border:3px solid rgba(255,255,255,.6)}
.btn-small{font-size:15px;padding:8px 14px;min-height:44px;border-radius:10px;background:var(--paper);border:2px solid var(--line);color:var(--navy);font-weight:800;cursor:pointer}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.card{background:var(--paper);border-radius:20px;padding:24px;border:2px solid var(--line)}
.num{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}

/* タイトル */
.title-wrap{min-height:100%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;padding-inline:16px}
.title-box{text-align:center;display:flex;flex-direction:column;gap:22px;align-items:center;padding-block:40px;max-width:820px}
.eyebrow{font-size:17px;letter-spacing:.12em;color:#BFD3E8}
.title-box h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,7vw,72px);line-height:1.2}
.vs{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:10px}
.vs .ab{display:inline-grid;place-items:center;width:1.4em;height:1.4em;border-radius:22px;font-size:.8em}
.title-box p{font-size:20px;margin:0;color:#DCE7F2}
.resume{background:rgba(255,255,255,.1);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* 先生用ガイド */
.guide{display:grid;gap:14px}
.guide h3{font-size:20px;color:var(--navy);margin-bottom:6px}
.guide ul{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:17px}
.guide table{border-collapse:collapse;width:100%;font-size:16px}
.guide td,.guide th{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.guide th{background:var(--soft);white-space:nowrap}
.tbl{overflow-x:auto}

/* じゅんび */
.page-h{font-size:28px;color:var(--navy)}
select{font-family:inherit;font-size:20px;padding:10px 14px;border-radius:12px;border:3px solid var(--line);background:var(--paper);min-height:56px}
.choice{border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 22px;font-size:20px;font-weight:800;cursor:pointer;min-height:58px}
.choice[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-soft);color:var(--orange-dark)}
.choice small{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.people{display:grid;gap:10px}
.person{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.person .predrow{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.pred{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px 4px 5px;font-size:15px;font-weight:800;cursor:pointer;min-height:40px}
.pred svg{width:24px;height:24px}
.pred[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c);background:var(--soft)}
.pred[aria-pressed="true"]::after{content:"✓";color:var(--c);font-weight:800;margin-left:2px}
.person input{font-family:inherit;font-size:19px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);width:100%;min-width:0}

/* ルール */
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rule{background:var(--paper);border-radius:18px;padding:18px;border:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rule h3{font-size:20px;color:var(--navy)}
.rule p{margin:0;font-size:16px}
.es{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.e{border-radius:14px;padding:12px;border:3px solid;display:flex;flex-direction:column;gap:2px;background:var(--paper)}
.e .h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;line-height:1.3}
.e .h svg{width:30px;height:30px;flex:none}
.e .s{font-size:14px;color:var(--muted)}
.e .en{font-size:12px;color:var(--muted);letter-spacing:.04em}

/* ゲーム上部 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.turnbox{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--navy);flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;background:#C7D1DC;display:block}
.dots i.done{background:var(--navy)}
.dots i.now{background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.pts{background:var(--navy);color:#fff;border-radius:999px;padding:3px 12px;font-size:16px;font-variant-numeric:tabular-nums}
.clock{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{padding:5px 12px;border-radius:999px;background:#DCE3EA;color:var(--muted);font-weight:800;font-size:15px}
.steps span.on{background:var(--navy);color:#fff}
.steps span.past{background:#BFD0E2;color:var(--navy)}

.stage{background:var(--paper);border-radius:22px;border:3px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:16px}
.stage.orange{border-color:var(--orange);background:#FFFBF8}
.tag{align-self:flex-start;background:var(--soft);color:var(--navy);border-radius:999px;padding:4px 14px;font-weight:800;font-size:15px}
.big-q{font-size:clamp(23px,3.1vw,31px);font-weight:800;color:var(--navy);line-height:1.55}
.mid-q{font-size:clamp(19px,2.3vw,23px);font-weight:800;color:var(--navy);line-height:1.55}
.speakrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.speakrow .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.rulebox{background:var(--yellow);border-radius:14px;padding:12px 16px;font-weight:800;font-size:19px}
.fact{background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;font-size:18px;display:flex;gap:10px;align-items:flex-start}
.fact b{color:#FFD9C4;flex:none}
.fact rt{color:#BFD3E8}

/* クイズ */
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{border:4px solid var(--line);border-radius:18px;background:var(--paper);padding:18px 12px;font-size:clamp(20px,2.6vw,28px);font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:116px;justify-content:center;text-align:center;line-height:1.35}
.opt .k{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.opt:hover:not(:disabled){border-color:var(--orange)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:#9E2A2A}
.opt.wrong .k{background:var(--bad)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:#1E6B40}
.opt.right .k{background:var(--ok)}
.opt:disabled{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.result{border-radius:16px;padding:16px 20px;font-size:19px;font-weight:700;display:flex;gap:14px;align-items:flex-start}
.result.good{background:var(--ok-soft);color:#1E6B40}
.result.bad{background:var(--bad-soft);color:#9E2A2A}
.result.info{background:var(--soft);color:var(--navy)}
.result b.big{font-size:25px;display:block}
.result .mark{font-family:var(--f-display);font-size:44px;line-height:1;flex:none}
.hintbox{background:var(--soft);border:2px dashed var(--navy-2);border-radius:14px;padding:10px 16px;font-weight:700;color:var(--navy)}

/* 二択 */
.ab-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.abc{border:4px solid;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--paper)}
.abc.A{border-color:var(--a)}.abc.B{border-color:var(--b)}
.lab{display:flex;align-items:center;gap:12px}
.letter{width:52px;height:52px;border-radius:14px;color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;flex:none}
.A .letter,.letter.A{background:var(--a)}.B .letter,.letter.B{background:var(--b)}
.abc .t{font-size:clamp(19px,2.3vw,24px);font-weight:800;line-height:1.45}
.abc ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.abc li{font-size:17px;display:flex;gap:8px;align-items:flex-start;line-height:1.55}
.ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;margin-top:2px}
.ic.p{background:var(--ok)}.ic.m{background:var(--bad)}
button.abc{cursor:pointer;font:inherit;color:inherit}
button.abc:hover{box-shadow:0 0 0 4px var(--orange-soft)}
button.abc[aria-pressed="true"].A{background:var(--a-soft);box-shadow:0 0 0 6px var(--a)}
button.abc[aria-pressed="true"].B{background:var(--b-soft);box-shadow:0 0 0 6px var(--b)}
.sel-badge{align-self:flex-start;background:var(--navy);color:#fff;border-radius:999px;padding:2px 14px;font-weight:800;font-size:16px}
.mayoi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.my{border:3px solid var(--line);border-radius:14px;background:var(--paper);padding:10px;font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px}
.my svg{width:34px;height:34px;flex:none}
.my[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-soft);color:var(--orange-dark);box-shadow:0 0 0 3px var(--orange)}

/* 交代・カウントダウン */
.pass{background:var(--navy);color:#fff;border-radius:22px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.pass .who{font-family:var(--f-display);font-size:clamp(32px,5vw,50px);line-height:1.25}
.pass p{margin:0;font-size:21px;color:#DCE7F2}
.pass .eye{width:90px;height:90px}
.voted-list{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.voted-list span{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 16px;font-weight:800;font-size:17px}
.voted-list span.done{background:var(--ok);color:#fff}
.count{font-family:var(--f-display);font-size:clamp(120px,22vw,220px);line-height:1;color:var(--orange);animation:zoom .7s}
@keyframes zoom{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}

/* 公開 */
.reveal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.rcol{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;border:4px solid}
.rcol.A{border-color:var(--a);background:var(--a-soft)}.rcol.B{border-color:var(--b);background:var(--b-soft)}
.rcol .head{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;line-height:1.45}
.rcol .cnt{font-family:var(--f-display);font-size:46px;line-height:1;margin-left:auto;font-variant-numeric:tabular-nums}
.rcol.A .cnt{color:var(--a)}.rcol.B .cnt{color:var(--b)}
.kl{display:grid;gap:6px}
.kl div{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:800;font-size:15px}
.kl .lbl{width:5.2em;flex:none}
.echip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px 3px 4px;color:#fff;font-weight:800;font-size:15px}
.echip svg{width:22px;height:22px}
.echip.lose{background:var(--paper)!important;color:var(--muted);border:2px dashed #A9B6C4;text-decoration:line-through}
.echip.lose svg{opacity:.45}
.names{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.nm{background:var(--paper);border:3px solid transparent;border-radius:12px;padding:6px 14px;font-weight:800;font-size:18px;animation:pop .5s backwards;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nm:nth-child(2){animation-delay:.15s}.nm:nth-child(3){animation-delay:.3s}.nm:nth-child(4){animation-delay:.45s}
.nm.changed{border-color:var(--orange)}
.nm .chg{font-size:13px;background:var(--orange);color:#fff;border-radius:999px;padding:0 8px}
.nm .mv svg{width:22px;height:22px;display:block}
.none{color:var(--muted);font-weight:700;padding:8px 0}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.talk{border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;color:#fff}
.talk.split{background:var(--orange)}
.talk.same{background:var(--navy)}
.talk h3{font-family:var(--f-display);font-weight:400;font-size:26px}
.talk p{margin:0;font-size:18px;font-weight:700}
.talk rt{color:rgba(255,255,255,.8)}
.wakei{background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:19px;font-weight:800;line-height:1.7}
.wakei span{display:inline-block;border-bottom:3px solid var(--orange);min-width:4em;text-align:center;color:var(--muted);font-size:15px}
.changebox{background:var(--soft);border-radius:14px;padding:12px 16px;font-weight:800;color:var(--navy)}

/* 結果 */
.end-title{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.5vw,46px);color:var(--navy);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.end-title small{font-family:var(--f-body);font-size:20px;font-weight:800;color:var(--muted)}
.end-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:14px}
.stat{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.stat .l{font-weight:800}
.stat .n{font-family:var(--f-display);font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .n small{font-size:20px}
.stat .q{font-size:17px;font-weight:800;line-height:1.45}
.stat.s1{background:var(--navy);color:#fff}.stat.s1 .l{color:#BFD3E8}
.stat.s2{background:var(--orange-soft);border:3px solid var(--orange)}.stat.s2 .l{color:var(--orange-dark)}
.stat.s3{background:var(--ok-soft);border:3px solid var(--ok)}.stat.s3 .l{color:#1E6B40}
.profiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.prof{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.prof .who{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px}
.ptype{border-radius:14px;padding:10px 14px;color:#fff;display:flex;align-items:center;gap:10px}
.ptype svg{width:40px;height:40px;flex:none}
.ptype .tn{font-size:20px;font-weight:800;line-height:1.3}
.ptype .ts{font-size:14px;opacity:.9}
.pbar{display:grid;grid-template-columns:120px minmax(0,1fr) 46px;gap:8px;align-items:center}
.pbar .nmb{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;line-height:1.3}
.pbar .nmb svg{width:22px;height:22px;flex:none}
.bar{height:18px;border-radius:9px;background:#E4E9EF;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.pbar .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;font-size:15px;color:var(--muted)}
.mrow{display:flex;gap:6px;flex-wrap:wrap;font-size:14px;font-weight:800;color:var(--muted);align-items:center}
.mrow span{background:var(--soft);border-radius:8px;padding:2px 8px}
.mrow span.hi{background:var(--orange-soft);color:var(--orange-dark)}
.copy{align-self:flex-start}
.predres{border-radius:10px;padding:6px 12px;font-weight:800;font-size:16px;background:var(--orange-soft);color:var(--orange-dark)}
.predres.hit{background:var(--ok-soft);color:#1E6B40}
.unitq{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;font-weight:800}
.nextbox{background:var(--navy);color:#fff;border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.nextbox h3{font-size:22px;color:#FFD9C4}
.nextbox p{margin:0;font-size:19px}
.nextbox rt{color:#BFD3E8}
.note{font-size:15px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 14px}


/* クラス集計 */
.agg-h{font-size:21px;color:var(--navy);margin-bottom:12px}
.aggbars{display:grid;gap:10px}
.aggbar{display:grid;grid-template-columns:140px minmax(0,1fr) 60px;gap:10px;align-items:center}
.aggbar .nmb{display:flex;align-items:center;gap:6px;font-weight:800;font-size:19px}
.aggbar .nmb svg{width:28px;height:28px}
.bar.big{height:30px;border-radius:10px}.bar.big i{border-radius:10px}
.aggbar .v{font-weight:800;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.aggnote{margin:12px 0 0;font-size:17px}
.aggrounds{display:grid;gap:12px}
.aggr{border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.aggr.hot{border:3px solid var(--orange);background:#FFFBF8}
.aggr-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:19px}
.aggr-m{margin-left:auto;font-weight:800;color:var(--muted);font-size:15px}
.hotchip{background:var(--orange);color:#fff;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:800}
.split2{display:flex;height:36px;border-radius:10px;overflow:hidden;font-weight:800;color:#fff;font-size:16px}
.split2 span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.split2 .sa{background:var(--a)}.split2 .sb{background:var(--b)}
.aggr-l{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;font-size:15px;color:var(--muted);font-weight:700}
.aggr-l b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;color:#fff;margin-right:6px;font-size:13px}
.la{background:var(--a)}.lb{background:var(--b)}
@media (max-width:860px){.aggr-l{grid-template-columns:minmax(0,1fr)}.aggbar{grid-template-columns:110px minmax(0,1fr) 50px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:800;font-size:20px;padding:14px 26px;border-radius:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}

@media (max-width:860px){
  .rules{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts,.ab-grid,.reveal,.end-top,.profiles{grid-template-columns:minmax(0,1fr)}
  .es{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opt{min-height:76px;flex-direction:row}
  .stage{padding:16px}
}
@media (max-width:520px){
  .rules,.mayoi{grid-template-columns:minmax(0,1fr)}
  .pbar{grid-template-columns:100px minmax(0,1fr) 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{min-height:100vh}
h1,h2,h3{letter-spacing:.015em;font-weight:700}
button{touch-action:manipulation}
button,input,select,textarea{transition:background .18s,border-color .18s,box-shadow .18s,transform .18s}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #277CBE;outline-offset:4px}
.screen{max-width:1192px;padding:28px 36px 40px;gap:24px}
.page-h{font-size:34px;letter-spacing:.02em}
.btn{border-radius:12px;min-height:54px;font-weight:700;font-size:20px;padding:13px 27px}
.btn-main{background:linear-gradient(130deg,#3475E8,#234FAD);box-shadow:0 6px 16px #2656B32B,inset 0 1px 0 #FFFFFF33}
.btn-main:hover:not(:disabled){background:linear-gradient(130deg,#4284F4,#285FC6);transform:translateY(-2px);box-shadow:0 10px 22px #2656B333}
.btn-main:active:not(:disabled){transform:translateY(0)}
.btn-main:disabled{background:#CAD4E2;box-shadow:none;color:#536780}
.btn-sub,.btn-ghost{background:#FFFFFFB3;border:1px solid #BFCFE3;color:var(--navy);box-shadow:none}
.btn-sub:hover,.btn-ghost:hover{background:#fff;border-color:#6C95CF}
.btn-small{border:1px solid #CCD9E8;border-radius:10px;font-weight:700;background:#FFFFFFB3;color:var(--muted);min-height:42px}
.btn-small:hover{color:var(--navy);background:#fff;border-color:#819DBF}
.card{border:1px solid #FFFFFFCC;border-radius:20px;background:#FFFFFFD9;box-shadow:var(--shadow);padding:25px}
.num{background:linear-gradient(135deg,#326FD9,#5289E0);font-size:18px;width:38px;height:38px}

/* Cover: illustration and text form one spread, without an enclosing card. */
.title-wrap{min-height:100vh;background:#F8FBFF var(--landscape) center/cover no-repeat;color:var(--navy);padding:38px 54px}
.title-box{max-width:1120px;width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:38px;row-gap:26px;align-items:start;text-align:left;padding:20px 0}
.title-box>*{grid-column:1;justify-self:start}
.title-box .eyebrow{grid-column:1/-1;color:#526B89;font-size:15px;letter-spacing:.07em;padding-bottom:22px;position:relative}
.title-box .eyebrow::after{content:"";position:absolute;bottom:0;left:0;width:58px;height:4px;background:#2C63CF}
.title-box h1{font-size:clamp(42px,5.25vw,66px);line-height:1.28;font-weight:700;letter-spacing:.015em;margin-top:7px}
.title-box .vs{justify-content:flex-start;gap:16px;margin-top:24px;color:#7289A1}
.title-box .vs .ab{font-size:.58em;width:1.55em;height:1.55em;border-radius:13px;color:white;box-shadow:0 7px 15px #142E5814}
.title-box p{font-size:18px;line-height:1.95;color:#435C79}
.title-box::after{content:"";grid-column:2;grid-row:2/6;width:100%;aspect-ratio:1;align-self:center;background:var(--discussion) center/contain no-repeat;pointer-events:none}
.title-box>.btn-main{min-width:236px;margin-top:3px}
.title-box>.row{justify-content:flex-start!important;gap:10px}
.title-box>.row .btn-small{color:#526B89!important;border-color:#AFC5DE!important;background:#FFFFFF66!important;font-size:13px}
.title-box .resume{align-items:flex-start;background:#FFFFFFB3;border:1px solid #FFFFFFE6;box-shadow:var(--shadow);padding:18px 20px;width:100%;font-size:16px}

/* Preparation and reference material. */
select,.person input{border:1px solid #CBD8E8;background:#F9FBFF;border-radius:10px;min-height:48px}
select{font-size:19px;padding:9px 14px}
.choice{border:1px solid #CCD9E8;background:#F7FAFE;border-radius:12px;font-size:19px;min-height:55px;font-weight:700}
.choice[aria-pressed="true"]{background:linear-gradient(135deg,#E3EEFF,#EFF6FF);border-color:#3975CF;box-shadow:inset 0 0 0 1px #3975CF;color:#204D98}
.choice small{font-size:12px}
.people{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 32px;margin-top:24px}
.person{align-content:start;gap:11px}
.person .predrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.pred{border:1px solid #D6E1EC;border-radius:9px;justify-content:flex-start;background:#F8FAFD;font-weight:700;font-size:14px;padding:6px 9px;min-height:42px}
.pred[aria-pressed="true"]{background:#EFF5FB;box-shadow:inset 0 0 0 1px var(--c)}
.person input{font-size:18px}
.rules{gap:24px;grid-template-columns:repeat(4,minmax(0,1fr))}
.rule{border:0;border-radius:0;background:transparent;box-shadow:none;padding:12px 18px 12px 0;border-right:1px solid #D0DEEB;gap:13px}
.rule:last-child{border:0}.rule h3{font-size:20px;line-height:1.5}.rule p{font-size:16px;line-height:1.8}
.e{border-width:0!important;border-left-width:3px!important;border-left-style:solid!important;border-radius:0;background:transparent;padding:10px 14px}
.e .h{font-size:18px}.e .s{margin-top:6px}
.guide{gap:26px}.guide h3{font-size:22px;margin-bottom:10px}.guide ul{line-height:1.9}
.guide th{background:#EDF3FB}.guide td,.guide th{padding:10px 13px;border-color:#DAE4EF}

/* Game header stays secondary to the decision. */
.topbar{padding:0 0 18px;border-bottom:1px solid #CFDDED;gap:12px}
.turnbox{font-size:16px;font-weight:700;gap:9px}
.clock{font-size:13px}.pts{font-size:13px;padding:4px 10px;background:#E0EAFB;color:#2856A7}
.dots{gap:5px}.dots i{height:9px;width:9px;background:#D1DEEE}.dots i.done{background:#87AADF}.dots i.now{background:#2861D5;box-shadow:0 0 0 3px #DAE8FC}
.steps{gap:4px}.steps span{font-size:12px;border-radius:7px;padding:6px 9px;background:transparent;color:#7A8BA1;font-weight:700}
.steps span.past{background:transparent;color:#557CAA}.steps span.on{background:#E1ECFC;color:#2256AB}
.topbar>.btn-small{font-size:12px;padding:6px 11px;min-height:36px}
.stage,.stage.orange{border:0;border-radius:0;box-shadow:none;background:transparent;padding:4px 0;gap:22px}
.tag{border-radius:0;background:transparent;color:#587292;padding:0;font-size:14px;letter-spacing:.04em}
.big-q{font-size:clamp(25px,2.65vw,33px);line-height:1.65;letter-spacing:.01em}
.mid-q{font-size:clamp(22px,2.2vw,27px);line-height:1.65}
.rulebox{border-radius:9px;background:#F7F1DD;padding:12px 17px;font-size:16px;color:#765720;border-left:3px solid #D6B46B}
.fact{background:linear-gradient(110deg,#E1ECFA,#EDF6F7);color:#284D75;border:0;border-radius:13px;font-weight:400;font-size:17px;padding:17px 20px;gap:22px}
.fact b{color:#285B9F;font-size:14px}.fact rt{color:#637C98}

/* Quiz: a dark stage and equally weighted answer cards. */
body:has(.opts),body:has(.pass){background:#122B53 var(--night) center/cover fixed no-repeat}
body:has(.opts) .topbar,body:has(.pass) .topbar{border-color:#FFFFFF22}
body:has(.opts) .turnbox,body:has(.pass) .turnbox{color:#E7F0FE}
body:has(.opts) .clock,body:has(.pass) .clock{color:#A8C0DC}
body:has(.opts) .steps span,body:has(.pass) .steps span{color:#AEC5E2}
body:has(.opts) .steps span.on,body:has(.pass) .steps span.on{background:#FFFFFF20;color:#fff}
body:has(.opts) .topbar .btn-small,body:has(.pass) .topbar .btn-small,body:has(.opts) .speakrow .btn-small{background:#FFFFFF12;color:#D3E5FC;border-color:#FFFFFF40}
body:has(.opts) .tag{color:#9DDDD5}
body:has(.opts) .big-q{color:#fff;font-size:clamp(26px,3vw,35px)}
body:has(.opts) .big-q rt{color:#B8CFEA}
body:has(.opts) .rulebox{background:transparent;border:0;padding:0;color:#BAD1EE;font-size:17px}
.opts{gap:20px;grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{border:2px solid transparent;background:linear-gradient(140deg,#FFFFFF,#E6EEFC);border-radius:19px;min-height:170px;gap:18px;padding:24px 18px;box-shadow:0 12px 28px #06173226,inset 0 1px 0 white;color:#173762;font-weight:700;font-size:30px}
.opt .k{width:35px;height:35px;font-size:17px;background:linear-gradient(135deg,#467FD9,#2B5DAF)}
.opt:hover:not(:disabled){border-color:#A8CCE8;transform:translateY(-3px);box-shadow:0 16px 36px #06173240}
.opt.wrong{border-color:#DC9CA9;background:linear-gradient(140deg,#FFF4F5,#F4DDE5);color:#994055;box-shadow:none}
.opt.right{border-color:#76C3AF;background:linear-gradient(140deg,#F1FFF9,#C9EDE3);color:#175F56;box-shadow:0 0 0 3px #73C8AD33}
.hintbox{background:#EAF2FE;border:0;border-left:3px solid #82B5F3;font-size:17px}
.result{border-radius:14px;font-size:17px;font-weight:400;padding:19px 22px}.result b.big{font-size:26px;margin-bottom:7px}
.result.good{background:linear-gradient(120deg,#E0F5ED,#F4FCF9)}
body:has(.opts) .fact{background:#FFFFFF12;color:#DBECFC}
body:has(.opts) .fact b{color:#B3EAE0;font-size:16px}
body:has(.opts) .btn-main,body:has(.pass) .btn-main{background:linear-gradient(125deg,#E2F8F0,#AEE4DD);color:#133F54;box-shadow:0 7px 22px #001B3C33}

/* A/B decisions: colored paper, restrained edges, stable selection geometry. */
.ab-grid{gap:23px;grid-template-columns:repeat(2,minmax(0,1fr))}
.abc{position:relative;border:2px solid transparent;border-radius:20px;padding:24px;gap:20px;box-shadow:var(--shadow),inset 0 1px 0 #fff}
.abc.A{background:linear-gradient(135deg,#FFFFFF 8%,#E6EFFF);border-color:#B8CEEF}
.abc.B{background:linear-gradient(135deg,#FFFFFF 8%,#FBF0D7);border-color:#DFCDAA}
.lab{gap:15px;align-items:flex-start}.abc .t{font-size:clamp(21px,2.15vw,26px);line-height:1.6}
.letter{width:48px;height:48px;font-size:27px;border-radius:12px;font-weight:700;box-shadow:inset 0 1px 0 #FFFFFF33}
.A .letter,.letter.A{background:linear-gradient(130deg,#437AE0,#2959B4)}
.B .letter,.letter.B{background:linear-gradient(130deg,#BE9447,#956320)}
.abc ul{gap:13px;padding-top:16px;border-top:1px solid #173F6C15}
.abc li{font-size:17px;line-height:1.8;gap:10px}.ic{width:23px;height:23px;font-size:15px;margin-top:3px}
button.abc:hover{transform:translateY(-2px);box-shadow:0 12px 30px #203D6914}
button.abc[aria-pressed="true"].A{background:linear-gradient(135deg,#F9FCFF,#D5E5FF);border-color:#2C63CF;box-shadow:0 0 0 2px #2C63CF,0 12px 28px #2C63CF20}
button.abc[aria-pressed="true"].B{background:linear-gradient(135deg,#FFFDF8,#F3E2BA);border-color:#A67429;box-shadow:0 0 0 2px #A67429,0 12px 28px #A6742920}
.sel-badge{position:absolute;top:-14px;right:18px;border-radius:7px;font-size:13px;padding:3px 12px;box-shadow:0 3px 8px #142E5815}
.abc.A .sel-badge{background:var(--a)}.abc.B .sel-badge{background:var(--b)}
.sel-badge::before{content:"✓ ";font-weight:700}
.mayoi{gap:14px}.my{min-height:58px;border:1px solid #CEDBE9;background:#FFFFFFAA;border-radius:11px;font-size:17px;font-weight:700}
.my svg{width:29px;height:29px}.my[aria-pressed="true"]{background:#E9F2FE;border-color:#2861D5;color:#234C9C;box-shadow:inset 0 0 0 1px #2861D5}

/* Private handoff and reveal countdown have a full-bleed atmosphere. */
.pass{background:transparent;box-shadow:none;border:0;min-height:calc(100vh - 155px);justify-content:center;padding:35px 24px;gap:24px}
.pass .who{font-weight:700;font-size:clamp(34px,4.7vw,58px);letter-spacing:.02em}
.pass p{font-size:20px;color:#C3D8EE}.pass .eye{width:70px;height:70px;color:#A5DFDE}
.voted-list{gap:10px;margin-bottom:10px}.voted-list span{border:1px solid #FFFFFF25;background:#FFFFFF0C;border-radius:8px;font-size:15px}
.voted-list span.done{background:#A9E4D626;color:#BBF3DF;border-color:#A9E4D645}
.count{color:#C2EFE4;text-shadow:0 0 55px #7AD7DC4D;font-weight:700}

/* Reveal: big counts, discussion area, and room to compare the trade-offs. */
body:has(.reveal){background:radial-gradient(ellipse at 50% 0,#CBDFEF99,transparent 60%),linear-gradient(145deg,#F7FBFF,#EAF3F0)}
.reveal{gap:23px;grid-template-columns:repeat(2,minmax(0,1fr))}
.rcol{border:1px solid #FFFFFFCC;border-radius:20px;padding:23px;gap:18px;box-shadow:var(--shadow)}
.rcol.A{background:linear-gradient(145deg,#F9FCFF,#DBE8FC);border-color:#BBD1EC}
.rcol.B{background:linear-gradient(145deg,#FFFEFA,#F5E7C8);border-color:#E3D3B2}
.rcol .head{align-items:flex-start;gap:12px;font-size:19px}.rcol .cnt{font-size:58px;font-weight:700;min-width:.75em}
.kl{gap:9px;padding-top:3px}.kl .lbl{color:#5D7089;font-size:13px}
.echip{font-size:13px;font-weight:700}.echip.lose{border-width:1px;background:#FFFFFF99!important}
.names{padding-top:6px;gap:10px}.nm{border:1px solid #FFFFFFDD;font-weight:700;border-radius:9px;font-size:17px;box-shadow:0 3px 7px #14375B0A}
.nm.changed{border:2px solid #4674BF;background:#F4F8FF}.nm:hover{transform:translateY(-2px);box-shadow:0 6px 14px #14375B14}
.talk,.talk.split,.talk.same{background:linear-gradient(120deg,#193B6B,#295FA7);color:#fff;border:0;border-radius:19px;padding:24px 26px;gap:13px}
.talk h3{font-size:29px;font-weight:700;color:#fff}.talk p{font-size:17px;line-height:1.75;font-weight:400;color:#D2E4F5}
.wakei{background:#FFFFFFF5;color:var(--ink);border:0;border-radius:11px;padding:16px 20px;font-size:18px;font-weight:700}
.wakei span{border-bottom-color:#477ABC;color:#5D7691}
.changebox{border-radius:0;background:transparent;border-left:3px solid #A9C4DC;font-weight:400;font-size:15px;line-height:1.85;color:#567088}

/* Summary / teacher aggregation: clear data hierarchy, quiet supporting panels. */
body:has(.end-title){background:radial-gradient(ellipse at top right,#C1DEDFAA,transparent 55%),linear-gradient(135deg,#FBFDFF,#E8F1F9)}
.end-title{font-size:44px;font-weight:700;letter-spacing:.03em}.end-title small{font-size:18px;color:var(--muted)}
.stat{border:0!important;border-radius:18px;padding:25px;gap:12px;box-shadow:var(--shadow)}
.stat .l{font-size:15px;font-weight:700}.stat .n{font-size:58px;font-weight:700;letter-spacing:-.035em}.stat .n small{font-size:20px;letter-spacing:0}
.stat.s1{background:linear-gradient(125deg,#193B6B,#316BDD);color:white}.stat.s1 .l{color:#CCDEF9}
.stat.s2{background:linear-gradient(130deg,#FFFDF7,#F3E9D1)}.stat.s2 .l{color:#99702C}
.stat.s3{background:linear-gradient(130deg,#F3FCF8,#D6ECE5)}.stat.s3 .l{color:#24796D}.stat.s3 .n{color:#24796D}
.profiles{gap:23px;margin-top:4px}.prof{border:1px solid #FFFFFFCC;border-radius:20px;padding:25px;gap:15px;box-shadow:var(--shadow)}
.prof .who{font-size:21px;font-weight:700}.ptype{border-radius:12px;padding:15px 17px;box-shadow:inset 0 1px 0 #FFFFFF33}
.ptype .tn{font-size:19px}.ptype .ts{font-size:13px;margin-top:6px;line-height:1.6}
.predres{font-size:14px;font-weight:700;padding:9px 12px}.bar{background:#E8EEF4;height:13px}.bar i{box-shadow:inset 0 1px 0 #FFFFFF44}
.pbar{gap:10px}.pbar .nmb{font-size:15px}.mrow{font-size:13px;font-weight:400;line-height:1.9}
.copy{margin-top:4px;border-color:#B8CCE4;color:#2A5797}
.nextbox{background:linear-gradient(120deg,#163C60,#277D83);color:#fff;border:0;border-radius:19px;padding:27px;box-shadow:var(--shadow)}
.nextbox h3{color:#B2E7DC;font-size:23px}.nextbox p{font-size:19px}.nextbox rt{color:#B8D9E4}
.unitq{background:#FFFFFF13;border-radius:9px;margin-top:5px;padding:15px;font-size:17px}
.note{background:transparent;padding:5px 0;font-size:13px;line-height:1.8}
.agg-h{font-size:23px}.aggr{border:0;border-top:1px solid #D5E0EE;border-radius:0;padding:20px 0;gap:13px}
.aggr.hot{background:linear-gradient(130deg,#EEF4FF,#F9FCFF);border:0;border-radius:14px;padding:20px}
.split2{height:39px;border-radius:8px}.split2 .sa{background:linear-gradient(90deg,#3062BC,#5284DC)}.split2 .sb{background:linear-gradient(90deg,#B18C44,#A3742C)}
.aggr-m{font-size:13px}.aggr-l{font-size:14px;line-height:1.85}.toast{background:#153B69;box-shadow:0 8px 30px #14365A30;font-size:17px;border:1px solid #FFFFFF22}

@media(min-width:861px) and (max-height:800px){
 .screen{padding-top:20px;gap:17px}.topbar{padding-bottom:13px}.stage{gap:16px}
 .title-wrap{padding:25px 48px}.title-box{gap:22px 28px;padding:8px 0}.title-box h1{font-size:58px}.title-box p{font-size:17px}
 .title-box .eyebrow{padding-bottom:17px}.title-box .vs{margin-top:18px}.title-box>.btn-main{margin-top:0}
 .abc{padding:20px;gap:13px}.abc ul{padding-top:12px;gap:10px}.abc li{font-size:16px;line-height:1.7}.abc .t{font-size:23px}
 .fact{padding:13px 17px;font-size:16px}.big-q{font-size:27px}.mid-q{font-size:24px}.rulebox{padding:9px 14px}
 .opt{min-height:157px}.rcol{padding:20px;gap:12px}.talk{padding:21px 24px}.talk p{font-size:16px}
}
@media(max-width:1000px){
 .screen{padding-inline:25px}.topbar{gap:12px}.steps{order:3;width:100%}.steps span{flex:1;text-align:center}
 .title-wrap{padding:28px 35px}.title-box{column-gap:22px}.title-box h1{font-size:48px}.title-box p{font-size:16px}.title-box .eyebrow{font-size:13px}
 .people{gap:22px}.pred{font-size:12px;padding-inline:6px}.pred svg{width:21px;height:21px}.abc .t{font-size:21px}
 .rule{padding-right:12px}.rule h3{font-size:18px}.rule p{font-size:15px}.e{padding-inline:10px}.e .h{font-size:16px}
}
@media(min-width:701px) and (max-width:860px){
 .ab-grid,.reveal,.end-top,.profiles{grid-template-columns:repeat(2,minmax(0,1fr))}.end-top .s1{grid-column:1/-1}
 .rules,.es{grid-template-columns:repeat(2,minmax(0,1fr))}.rule:nth-child(2){border:0}.opt{flex-direction:column;font-size:25px;padding:20px 12px;min-height:160px}
 .abc{padding:18px}.lab{gap:10px}.letter{width:39px;height:39px;font-size:23px}.abc li{font-size:15px}.abc .t{font-size:19px}
 .title-box h1{font-size:43px}.title-box p{font-size:15px}.title-box .vs{margin-top:18px}.title-box::after{grid-row:2/5}
 .title-box>.row{grid-column:1/-1}
}
@media(max-width:700px){
 .screen{padding:22px 18px 32px;gap:20px}.page-h{font-size:29px}.card{padding:20px}.people{grid-template-columns:1fr;gap:24px}
 .pred{font-size:14px;padding:7px 10px}.people .person input{font-size:17px}
 .title-wrap{padding:24px}.title-box{display:flex;align-items:flex-start;gap:23px;padding:6px 0;text-align:left;max-width:470px}
 .title-box .eyebrow{order:0;font-size:12px;padding-bottom:16px}.title-box h1{order:1;font-size:clamp(38px,8.8vw,53px);margin-top:0}
 .title-box .vs{margin-top:16px;gap:13px}.title-box::after{order:2;align-self:center;width:100%;height:220px;aspect-ratio:auto;background-position:center}
 .title-box p{order:3;font-size:15px;line-height:1.9}.title-box>.btn-main,.title-box>.resume{order:4;width:100%}
 .title-box>.row{order:5;gap:8px;justify-content:center!important;align-self:center}.title-box>.row .btn-small{font-size:12px;padding:8px}
 .title-box .resume>.row{width:100%}.title-box .resume .btn{flex:1;padding-inline:12px;font-size:16px}
 .ab-grid,.reveal,.end-top,.profiles{grid-template-columns:1fr;gap:20px}.rules,.es{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
 .rule:nth-child(2){border:0}.rule h3{font-size:18px}.rule p{font-size:14px}.e .h{font-size:15px}
 .turnbox{font-size:13px;gap:7px}.pts{font-size:12px}.clock{font-size:12px}.topbar{padding-bottom:14px}.steps span{padding:5px 3px;font-size:11px}
 .stage{gap:19px;padding:0}.speakrow{flex-wrap:wrap}.speakrow .btns{width:100%;justify-content:flex-start}
 .big-q,body:has(.opts) .big-q{font-size:25px;line-height:1.8}.mid-q{font-size:22px}.tag{font-size:12px}
 .opts{grid-template-columns:1fr;gap:12px}.opt{flex-direction:row;min-height:86px;justify-content:flex-start;padding:17px 22px;font-size:25px;border-radius:15px}
 .opt .k{width:34px;height:34px}.result{padding:16px;font-size:16px}.result b.big{font-size:22px}
 .fact{flex-direction:column;gap:9px;padding:16px;font-size:15px}.fact b br{display:none}.fact b{font-size:13px}
 .abc{padding:20px;gap:15px;border-radius:17px}.abc .t{font-size:21px}.abc li{font-size:16px}.letter{width:42px;height:42px;font-size:24px}
 .rulebox{font-size:15px}.mayoi{grid-template-columns:1fr;gap:9px}.my{justify-content:flex-start;padding-inline:20px;min-height:53px;font-size:17px}
 .stage>.row.end>.btn{width:100%}.pass{min-height:calc(100vh - 195px);padding:26px 10px}.pass p{font-size:17px}.pass .who{font-size:35px}

let AGG_TEXT = '';
const SAMPLE_LINES = [
 '【1組1班 例A】タイプ：環境（環境3/3、安定供給2/3、安全1/3、電気代0/3）／予想：環境／答え：燃料の輸入=B(少し) 森と太陽光=A(すごく) 原子力=A(すごく) 建てる場所=B(少し) AIと電気=B(すごく)',
 '【1組1班 例B】タイプ：電気代（電気代3/3、安定供給2/3、安全1/3、環境0/3）／予想：安全／答え：燃料の輸入=A(すぐ) 森と太陽光=B(少し) 原子力=A(少し) 建てる場所=A(すぐ) AIと電気=A(少し)',
 '【1組2班 例C】タイプ：安全（安全3/3、電気代1/3、安定供給1/3、環境0/3）／予想：安全／答え：燃料の輸入=B(すぐ) 森と太陽光=B(すぐ) 原子力=B(すごく) 建てる場所=B(すぐ) AIと電気=B→A(すごく)',
 '【1組2班 例D】タイプ：安定供給（安定供給3/3、環境2/3、電気代1/3、安全0/3）／予想：環境／答え：燃料の輸入=B(少し) 森と太陽光=A(少し) 原子力=A(すごく) 建てる場所=A(少し) AIと電気=A(すぐ)',
 '【1組3班 例E】タイプ：環境・安全（環境2/3、安全2/3、安定供給1/3、電気代0/3）／予想：環境／答え：燃料の輸入=B(すぐ) 森と太陽光=A→B(すごく) 原子力=B(すごく) 建てる場所=B(少し) AIと電気=B(少し)',
 '【1組3班 例F】タイプ：安定供給（安定供給3/3、電気代1/3、環境1/3、安全0/3）／予想：電気代／答え：燃料の輸入=B(少し) 森と太陽光=B(すぐ) 原子力=A(少し) 建てる場所=A(少し) AIと電気=A(すごく)',
].join('\n');
const SHORT_RE = new RegExp(`(${ROUNDS.map(r=>r.short).join('|')})=([AB])(?:→([AB]))?\\((すぐ|少し|すごく|-)\\)`,'g');
const NAME2ID = Object.fromEntries(ES_ORDER.map(id=>[ES[id].name,id]));
function parseAgg(text){
  const out = [];
  text.split(/\r?\n/).forEach(line=>{
    line = line.replace(/^"|"$/g,'').trim();
    const h = line.match(/【(\d+)組(\d+)班\s*(.*?)】/); if(!h) return;
    const tm = line.match(/タイプ：([^（／]+)/);
    const types = tm ? tm[1].split('・').map(x=>NAME2ID[x.trim()]).filter(Boolean) : [];
    const pm = line.match(/予想：([^／]+)/);
    const pred = pm ? NAME2ID[pm[1].trim()]||null : null;
    const ans = {};
    for(const m of line.matchAll(SHORT_RE)){
      const ri = ROUNDS.findIndex(r=>r.short===m[1]);
      ans[ri] = {first:m[2], final:m[3]||m[2], changed:!!m[3], mayoi:{'すぐ':1,'少し':2,'すごく':3}[m[4]]||0};
    }
    out.push({kumi:h[1], han:h[2], name:h[3], types, pred, ans});
  });
  return out;
}
function rAgg(){
  const rows = parseAgg(AGG_TEXT);
  const isSample = AGG_TEXT===SAMPLE_LINES;
  let result = '';
  if(AGG_TEXT && !rows.length){
    result = `<div class="result bad"><span class="mark">×</span><div><b class="big">読み取れませんでした</b>「【1組1班 名前】タイプ：…」で始まる行を貼りつけてください。フォームの「ゲームの結果」の列だけをコピーします。</div></div>`;
  } else if(rows.length){
    const N = rows.length;
    const tc = {stable:0,cost:0,env:0,safe:0}; rows.forEach(r=>r.types.forEach(t=>tc[t]++));
    const maxT = Math.max(1,...Object.values(tc));
    const withPred = rows.filter(r=>r.pred), hit = withPred.filter(r=>r.types.includes(r.pred)).length;
    const per = ROUNDS.map((R,ri)=>{
      const a = rows.filter(r=>r.ans[ri]);
      const A = a.filter(r=>r.ans[ri].final==='A').length, B = a.length-A;
      const ch = a.filter(r=>r.ans[ri].changed).length;
      const ms = a.filter(r=>r.ans[ri].mayoi); const avg = ms.length? ms.reduce((x,r)=>x+r.ans[ri].mayoi,0)/ms.length : 0;
      const big = a.filter(r=>r.ans[ri].mayoi===3).length;
      return {ri, n:a.length, A, B, ch, avg, big};
    }).filter(x=>x.n);
    const hot = per.reduce((m,x)=>x.avg>m.avg?x:m, {avg:-1});
    const changes = per.reduce((s,x)=>s+x.ch,0);
    result = `
      ${isSample?'<div class="note" style="font-weight:800;color:var(--orange-dark)">これは例のデータです。本番ではフォームの回答を貼りつけてください。</div>':''}
      <div class="end-top">
        <div class="stat s1"><span class="l">集計した人数</span><span class="n">${N}<small> 人</small></span></div>
        <div class="stat s2"><span class="l">クラスでいちばん迷った問題</span><span class="q">「${fu(ROUNDS[hot.ri].short)}」<br>迷い度 ${hot.avg.toFixed(1)}（すごく迷った ${hot.big}人）</span></div>
        <div class="stat s3"><span class="l">話し合いで考えが変わった</span><span class="n">${changes}<small> 回</small></span></div>
      </div>
      <div class="card"><h3 class="agg-h">クラスのタイプ（同点の人は両方に数えています）</h3>
        <div class="aggbars">${ES_ORDER.map(id=>`<div class="aggbar"><span class="nmb">${eIcon(id)}${fu(ES[id].name)}</span><div class="bar big"><i style="width:${tc[id]/maxT*100}%;background:${ES[id].color}"></i></div><span class="v">${tc[id]}人</span></div>`).join('')}</div>
        ${withPred.length?`<p class="aggnote">予想どおりだった人：<b>${hit} / ${withPred.length}人</b>　→　予想とちがった人に「どの問題で、思っていたのとちがう方をえらんだ？」と聞いてみる。</p>`:''}
      </div>
      <div class="card"><h3 class="agg-h">問題ごとの結果</h3>
        <div class="aggrounds">${per.map(x=>{ const R=ROUNDS[x.ri]; const pa = x.n? x.A/x.n*100:0;
          return `<div class="aggr ${x.ri===hot.ri?'hot':''}">
            <div class="aggr-h"><b>${fu(R.short)}</b>${x.ri===hot.ri?'<span class="hotchip">いちばん迷った</span>':''}<span class="aggr-m">迷い度 ${x.avg.toFixed(1)}・考えを変えた ${x.ch}人</span></div>
            <div class="split2"><span class="sa" style="width:${pa}%">${x.A?`A ${x.A}人`:''}</span><span class="sb" style="width:${100-pa}%">${x.B?`B ${x.B}人`:''}</span></div>
            <div class="aggr-l"><span><b class="la">A</b>${fu(R.A.t)}（守る：${R.A.keep.map(k=>ES[k].name).join('・')}）</span><span><b class="lb">B</b>${fu(R.B.t)}（守る：${R.B.keep.map(k=>ES[k].name).join('・')}）</span></div>
          </div>`;}).join('')}</div>
      </div>`;
  }
  app.innerHTML = `<section class="screen">
    <div class="row between"><h2 class="page-h">クラス集計（先生用）</h2><div class="row"><button class="btn btn-sub" id="toGuide">先生用ガイド</button><button class="btn btn-sub" id="back">タイトルへ</button></div></div>
    <div class="card" style="display:grid;gap:12px">
      <label for="aggIn" style="font-weight:800">フォームの回答（スプレッドシート）の「ゲームの結果」列をコピーして、ここに貼りつけます</label>
      <textarea id="aggIn" rows="5" style="width:100%;font-family:inherit;font-size:15px;padding:10px;border-radius:12px;border:2px solid var(--line)" placeholder="【2組3班 さとう】タイプ：環境（…）／予想：環境／答え：燃料の輸入=B(少し) …">${esc(AGG_TEXT)}</textarea>
      <div class="row"><button class="btn btn-main" id="doAgg">集計する</button><button class="btn-small" id="sample">例のデータを入れる</button><button class="btn-small" id="clr">消す</button></div>
    </div>
    ${result}
  </section>`;
  $('doAgg').onclick = ()=>{ AGG_TEXT = $('aggIn').value; rAgg(); };
  $('sample').onclick = ()=>{ AGG_TEXT = SAMPLE_LINES; rAgg(); };
  $('clr').onclick = ()=>{ AGG_TEXT = ''; rAgg(); };
  $('back').onclick = ()=>{S.screen='title'; render();};
  $('toGuide').onclick = ()=>{S.screen='guide'; render();};
}

function quizHTML(r){
  const Q = r.quiz, done = S.phase==='quizDone', got = S.quizGot[RI()];
  let res = '';
  if(done){
    res = got>0
      ? `<div class="result good"><span class="mark">○</span><div><b class="big">正解！ ＋${got}点</b>${fu(Q.exp)}</div></div>`
      : `<div class="result bad"><span class="mark">×</span><div><b class="big">答えは「${fu(Q.opts[Q.ans])}」</b>${fu(Q.exp)}</div></div>`;
    res += `<div class="fact"><b>この事実を使って、次の二択を考えよう</b></div>`;
  } else if(S.tries.length===1){
    res = `<div class="result info"><span class="mark">！</span><div><b class="big">ちがうよ。もう1回！</b>正解すると1点。ヒントも見てみよう。</div></div>`;
  }
  return `<div class="stage">
    <span class="tag">ふりかえり：${fu(r.lesson)}（${esc(r.page)}）</span>
    <div class="speakrow"><div class="big-q">${fu(Q.q)}</div>
      <div class="btns">${!done?`<button class="btn-small" id="hintBtn">ヒント</button>`:''}<button class="btn-small" id="rd">読み上げ</button></div></div>

    <div class="opts">${Q.opts.map((o,i)=>{
      const wrong = S.tries.includes(i) && i!==Q.ans, right = done && i===Q.ans;
      return `<button class="opt ${wrong?'wrong':''} ${right?'right':''}" data-i="${i}" ${(done||wrong)?'disabled':''}><span class="k">${'あいう'[i]}</span>${fu(o)}</button>`;}).join('')}</div>

}

      <div class="mayoi">${MAYOI.map(m=>`<button class="my" data-v="${m.v}" aria-pressed="${S.my===m.v}">${mFace(m.v)}${m.label}</button>`).join('')}</div>
    </div>
    <div class="row end"><button class="btn btn-main" id="cast" ${ready?'':'disabled'}>${!S.pick?'AかBをタップしよう':!S.my?'迷ったかをえらぼう':`${S.pick}に投票する`}</button></div>
  </div>`;
}
function readyHTML(){
  return `<div class="pass">
    <div class="who">全員、投票した！</div>
    <p>みんなで画面を見よう。</p>
    <button class="btn btn-main" id="open" style="font-size:26px;min-height:70px;padding-inline:40px">3・2・1で公開！</button>
  </div>`;
}
function countHTML(){ return `<div class="pass" style="min-height:360px;justify-content:center"><div class="count" id="cd">3</div></div>`; }

/* --- 公開 --- */
function revealHTML(r){
  const ri = RI(), v = S.votes[ri], f = S.first[ri], m = S.mayoi[ri];
  const firstA = f.filter(x=>x==='A').length, firstB = f.length-firstA;
  const split = firstA && firstB;
  const minority = !split ? null : firstA<firstB ? 'A' : firstB<firstA ? 'B' : null;
  const col = k => {
    const who = v.map((x,i)=>x===k?i:-1).filter(i=>i>=0);
    return `<div class="rcol ${k}">
      <div class="head"><span class="letter ${k}" style="width:46px;height:46px;font-size:24px">${k}</span><span>${fu(r[k].t)}</span><span class="cnt">${who.length}</span></div>
      <div class="kl"><div><span class="lbl">守れる</span>${r[k].keep.map(x=>echip(x)).join('')}</div>
        <div><span class="lbl">手放す</span>${r[k].lose.map(x=>echip(x,true)).join('')}</div></div>
      <div class="names">${who.map(i=>`<button class="nm ${v[i]!==f[i]?'changed':''}" data-i="${i}" title="タップすると考えを変えられます">${esc(nameOf(i))}${v[i]!==f[i]?'<span class="chg">変えた</span>':''}${m[i]>=2?`<span class="mv" title="${['','','少し迷った','すごく迷った'][m[i]]}">${mFace(m[i])}</span>`:''}</button>`).join('') || '<span class="none">だれもいない</span>'}</div>
    </div>`;
  };
  const last = S.k===S.order.length-1;
  const wakei = `<div class="wakei">「わたしは <span>守りたいもの</span> を大事にしたいから、<span>A／B</span> にしました。<br>でも、<span>手放すもの</span> が心配なので、<span>おぎなう方法</span> と思います。」</div>`;
  const talk = split
    ? `<div class="talk split"><h3>意見が分かれた！</h3>
        <p>${minority?`人数が少ない <b>${minority}</b> の人から`:'どちらからでもいいので'}、1人ずつ理由を言おう。この言い方を使ってみよう：</p>${wakei}</div>`
    : `<div class="talk same"><h3>全員が${firstA?'A':'B'}！</h3>
        <p>でも、もし <b>${firstA?'B':'A'}</b> をえらぶ人がいるとしたら、どんな理由だと思う？　班で考えよう。</p>${wakei.replace('わたしは','その人は').replace('にしました','にした')}</div>`;
  return `<div class="stage">
    <div class="row between"><span class="tag">問題${S.k+1}の結果</span><button class="btn-small" id="rd">読み上げ</button></div>
    <div class="mid-q">${fu(r.odai)}</div>
    <div class="reveal">${col('A')}${col('B')}</div>
    ${talk}
    <div class="changebox">名前の横の顔は、迷った人のしるし。「何と何で迷った？」と聞いてみよう。<br>話し合って<b>考えが変わった人</b>は、自分の名前をタップしてね（反対の側に動きます）</div>
    <div class="row end"><button class="btn btn-main" id="nextR">話し合った！　${last?'結果を見る':'次の問題へ'}</button></div>
  </div>`;
}

/* --- 操作 --- */
function bind(r){
  const rd = $('rd');
  const ri = RI();
  if(S.phase==='quiz' || S.phase==='quizDone'){
    rd.onclick = ()=>speak(S.phase==='quizDone' ? `答えは、${r.quiz.opts[r.quiz.ans]}。${r.quiz.exp}` : `${r.quiz.q}。${r.quiz.opts.map((o,i)=>`${'あいう'[i]}、${o}`).join('。')}`);
    const h = $('hintBtn'); if(h) h.onclick = ()=>{S.hint=true; rGame(); speak(r.quiz.hint);};
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const i = +b.dataset.i;
      S.tries.push(i);
      if(i===r.quiz.ans){ const p = S.tries.length===1?2:1; S.quizGot[ri]=p; S.points+=p; S.phase='quizDone'; render(); }
      else if(S.tries.length>=2){ S.quizGot[ri]=0; S.phase='quizDone'; render(); }
      else { rGame(); save(); const el=document.querySelector(`.opt[data-i="${i}"]`); el && el.classList.add('shake'); }
    });
    const t = $('toOdai'); if(t) t.onclick = ()=>{S.phase='odai'; render();};
  }
  else if(S.phase==='odai'){
    rd.onclick = ()=>speak(readOdai(r));
    $('toPass').onclick = ()=>{S.voter=0; S.pick=null; S.my=null; S.first[ri]=[]; S.votes[ri]=[]; S.mayoi[ri]=[]; S.phase='pass'; render();};
  }
  else if(S.phase==='pass'){ $('look').onclick = ()=>{S.pick=null; S.my=null; S.phase='vote'; render();}; }
  else if(S.phase==='vote'){
    rd.onclick = ()=>speak(`${r.odai}。A、${r.A.t}。B、${r.B.t}。`);
    const keepY = fn => ()=>{ const y=window.scrollY; fn(); rGame(); window.scrollTo(0,y); };
    document.querySelectorAll('button.abc').forEach(b=>b.onclick=keepY(()=>{S.pick=b.dataset.k;}));
    document.querySelectorAll('.my').forEach(b=>b.onclick=keepY(()=>{S.my=+b.dataset.v;}));
    $('cast').onclick = ()=>{
      S.first[ri][S.voter]=S.pick; S.votes[ri][S.voter]=S.pick; S.mayoi[ri][S.voter]=S.my;
      S.pick=null; S.my=null; S.voter++;
      S.phase = S.voter>=S.players ? 'ready' : 'pass';
      render(); if(S.phase==='pass') toast('投票しました。次の人に交代！');
    };
  }
  else if(S.phase==='ready'){
    $('open').onclick = ()=>{
      if(reduce){ S.phase='reveal'; render(); return; }
      S.phase='count'; rGame();
      let n=3; const tick=()=>{ n--; if(n<=0){ S.phase='reveal'; render(); return; } const cd=$('cd'); if(cd){ cd.textContent=n; cd.style.animation='none'; void cd.offsetWidth; cd.style.animation=''; } setTimeout(tick,700); };
      setTimeout(tick,700);
    };
  }
  else if(S.phase==='reveal'){
    const v = S.votes[ri];
    rd.onclick = ()=>{
      const a = v.filter(x=>x==='A').length, b = v.length-a;
      const kl = k=>`${k}は、${r[k].keep.map(x=>ES[x].name).join('と')}を守れるけれど、${r[k].lose.map(x=>ES[x].name).join('と')}を手放す選択。`;
      speak(`Aは${a}人、Bは${b}人。${kl('A')}${kl('B')}`+(a&&b?'人数が少ないほうから、理由を言おう。':'反対の立場の理由を考えよう。'));
    };
    document.querySelectorAll('.nm').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i; v[i] = v[i]==='A'?'B':'A';
      const y=window.scrollY; rGame(); window.scrollTo(0,y); save();
      toast(`${nameOf(i)}は ${v[i]} に変えました`);
    });
    $('nextR').onclick = ()=>{
      if(S.k>=S.order.length-1){ S.screen='end'; render(); return; }
      S.k++; S.phase='quiz'; S.tries=[]; S.hint=false; render();
    };
  }
}

/* ============================================================
   結果
   ============================================================ */
function analyze(){
  // チャンス＝その問題で「守れる」選択肢として出てきた回数
  const chance = {stable:0,cost:0,env:0,safe:0};
  S.order.forEach(ri=>{ const r=ROUNDS[ri]; new Set([...r.A.keep,...r.B.keep]).forEach(x=>chance[x]++); });
  const people = Array.from({length:S.players},(_,i)=>{
    const c = {stable:0,cost:0,env:0,safe:0};
    let changed = [], most = null, mostV = 0;
    S.order.forEach((ri,k)=>{
      const pick = S.votes[ri][i]; if(pick) ROUNDS[ri][pick].keep.forEach(x=>c[x]++);
      if(S.first[ri][i] && S.first[ri][i]!==pick) changed.push(k);
      const mv = S.mayoi[ri][i]||0; if(mv>mostV){ mostV=mv; most=k; }
    });
    const rate = id => chance[id]? c[id]/chance[id] : 0;
    const top = Math.max(...ES_ORDER.map(rate));
    const tops = ES_ORDER.filter(id=>rate(id)===top);
    const low = Math.min(...ES_ORDER.map(rate));
    const lows = ES_ORDER.filter(id=>rate(id)===low && !tops.includes(id));
    return {c, rate, tops, lows, changed, most, mostV};
  });
  // 班でいちばん迷った問題（迷い度の合計）
  let hotK = 0, hotV = -1;
  S.order.forEach((ri,k)=>{ const s=(S.mayoi[ri]||[]).reduce((a,b)=>a+(b||0),0); if(s>hotV){hotV=s; hotK=k;} });
  const changes = people.reduce((a,p)=>a+p.changed.length,0);
  return {chance, people, hotK, changes};
}
function formText(i, A){
  const p = A.people[i];
  const list = ES_ORDER.slice().sort((a,b)=>p.rate(b)-p.rate(a)).map(id=>`${ES[id].name}${p.c[id]}/${A.chance[id]}`).join('、');
  const picks = S.order.map(ri=>{ const f=S.first[ri][i], v=S.votes[ri][i]; if(!v) return ''; return `${ROUNDS[ri].short}=${f&&f!==v?`${f}→${v}`:v}(${['','すぐ','少し','すごく'][S.mayoi[ri][i]]||'-'})`; }).filter(Boolean).join(' ');
  return `【${S.kumi}組${S.han}班 ${nameOf(i)}】タイプ：${p.tops.map(x=>ES[x].name).join('・')}（${list}）／予想：${S.pred[i]?ES[S.pred[i]].name:'なし'}／答え：${picks}`;
}
function rEnd(){
  const A = analyze();
  const typeCard = p => {
    const id = p.tops[0];
    return `<div class="ptype" style="background:${ES[id].color}">${eIcon(id).replace(/fill="var\(--c-[a-z]+\)"/,'fill="rgba(255,255,255,.25)"')}
      <div><div class="tn">${fu(ES[id].type)}${p.tops.length>1?` ＋${p.tops.slice(1).map(x=>fu(ES[x].name)).join('・')}`:''}</div><div class="ts">${fu(ES[id].typeSub)}</div></div></div>`;
  };
  app.innerHTML = `<section class="screen">
    <div class="row between"><div class="end-title">結果発表</div><button class="btn-small" id="rd">読み上げ</button></div>
    <div class="end-top">
      <div class="stat s1"><span class="l">ふりかえりクイズ</span><span class="n">${S.points}<small> / ${S.order.length*2}点</small></span></div>
      <div class="stat s2"><span class="l">班でいちばん迷った問題</span><span class="q">問題${A.hotK+1}「${fu(ROUNDS[S.order[A.hotK]].short)}」</span></div>
      <div class="stat s3"><span class="l">話し合いで考えが変わった</span><span class="n">${A.changes}<small> 回</small></span></div>
    </div>
    <div style="font-weight:800;font-size:21px;color:var(--navy)">一人ひとりが「大事にしたもの」</div>
    <div class="profiles">${A.people.map((p,i)=>`<div class="prof">
      <div class="who"><span class="num">${i+1}</span>${esc(nameOf(i))}</div>
      ${typeCard(p)}
      ${S.pred[i]?`<div class="predres ${p.tops.includes(S.pred[i])?'hit':''}">予想：${fu(ES[S.pred[i]].name)} → ${p.tops.includes(S.pred[i])?'予想どおり！':'予想とちがった！　どうしてだろう？'}</div>`:''}
      ${ES_ORDER.map(id=>`<div class="pbar"><span class="nmb">${eIcon(id)}${fu(ES[id].name)}</span><div class="bar"><i style="width:${p.rate(id)*100}%;background:${ES[id].color}"></i></div><span class="v">${p.c[id]}/${A.chance[id]}</span></div>`).join('')}
      <div class="mrow">迷い度：${S.order.map((ri,k)=>`<span class="${k===p.most&&p.mostV>=2?'hi':''}">問${k+1} ${['','すぐ','少し','すごく'][S.mayoi[ri][i]]||'-'}</span>`).join('')}</div>
      ${p.changed.length?`<div class="mrow">考えが変わった：${p.changed.map(k=>`<span class="hi">問題${k+1}</span>`).join('')}</div>`:''}
      ${p.lows.length?`<div class="mrow">いちばん手放したもの：<span>${p.lows.map(x=>fu(ES[x].name)).join('・')}</span></div>`:''}
      <div class="mrow ws1">ワークシート１に書こう：<span class="hi">${p.tops.map(x=>fu(ES[x].name)).join('・')}</span>を大事にする「${fu(ES[p.tops[0]].type)}」</div>
    </div>`).join('')}</div>
    <div class="nextbox"><h3>このあと考えること</h3>
      <p>4つ全部を大事にできたらいいけれど、二択では、どれかを手放しました。</p>
      <p>①あなたなら、3E+Sの<b>どれをいちばん大事にして</b>、<b>どれを少しがまんする</b>？</p>
      <p>②大事にしたいものが決まったら、それに合う<b>地方</b>と<b>発電所</b>を考えよう。手放したものの弱点は、どうおぎなう？</p>
      <div class="unitq">単元の問い：日本に新しい発電所を建設するなら、どの地方に、どのような発電所を建設するか。</div>
      <p style="color:#FFD9C4">自分のタイプをワークシート１に書いたら、先生の合図があるまで、この画面のまま待とう。</p></div>
    <div class="note">二択のお題は、考えやすくするために、本当のことを単純にしています。クイズの数値は教科書のものです。</div>
    <div class="row"><button class="btn btn-sub" id="again">はじめからやり直す</button></div>
  </section>`;
  $('rd').onclick = ()=>speak('結果発表。'+A.people.map((p,i)=>`${nameOf(i)}は、${ES[p.tops[0]].type}。${p.tops.map(id=>ES[id].name).join('と')}を大事にしました`).join('。')+'。あなたなら、どれをいちばん大事にして、どれを少しがまんする？');
  $('again').onclick = ()=>{ const keep={kumi:S.kumi,han:S.han,players:S.players,names:S.names,pred:S.pred,furi:S.furi,mode:S.mode}; clearSave(); S=Object.assign(newState(),keep,{screen:'rule'}); render(); };
}

render();
</script>
